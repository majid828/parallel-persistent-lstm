# ==========================================================
# Parallel Persistent LSTM Test Configuration
# ==========================================================


# ----------------------------------------------------------
# Basin lists
# ----------------------------------------------------------

train_basin_file: /mnt/disk1/CAMELS_US/basin_lists/list_507_copy_OWP1.txt
validation_basin_file: /mnt/disk1/CAMELS_US/basin_lists/list_507_copy_OWP1.txt
test_basin_file: /mnt/disk1/CAMELS_US/basin_lists/list_507_copy_OWP1.txt


# ----------------------------------------------------------
# Experiment information
# ----------------------------------------------------------

run_dir: /home/mhshah1/runs/parallel_persistent_test

experiment_name: parallel_persistentlstm_test


# ----------------------------------------------------------
# Dates
# ----------------------------------------------------------

train_start_date: "01/01/1990"
train_end_date: "30/09/2008"

validation_start_date: "01/10/2008"
validation_end_date: "30/09/2012"

test_start_date: "01/10/2012"
test_end_date: "30/10/2013"

# ----------------------------------------------------------
# Dataset
# ----------------------------------------------------------

dataset: camels_us          #for daily data
#dataset: hourly_camels_us
data_dir: /mnt/disk1/CAMELS_US/
#forcings: nldas_hourly
forcings: nldas          #for daily data


# ==========================================================
# MODEL
# ==========================================================

model: persistentlstm

head: regression

output_activation: linear


hidden_size: 256

initial_forget_bias: 3

output_dropout: 0.4



# ----------------------------------------------------------
# NEW PARALLEL PERSISTENT STRATEGY
# ----------------------------------------------------------

training_strategy: parallel

persistent_state: true

parallel_persistent_n_basins: 10

basin_state_cache: true



nan_handling_method: masked



# ==========================================================
# Sequence settings
# ==========================================================

seq_length: 2

predict_last_n: 2

non_overlapping_sequences: true

seq_stride: 2


eval_warmup_steps: 30



# ==========================================================
# Inputs
# ==========================================================

dynamic_inputs:
 #- convective_fraction
 #- longwave_radiation
 #- potential_energy
 #- potential_evaporation
 #- pressure
 #- shortwave_radiation
 #- specific_humidity
 #- temperature
 #- total_precipitation
 #- wind_u
 #- wind_v
 - PRCP(mm/day)   #for daily data
 - SRAD(W/m2)   #for daily data
 #- Tmax(C)      #for daily data
 #- Tmin(C)       #for daily data
 - Vp(Pa)
 - Tmean(C)


target_variables:
 #["qobs_cfs"]
- QObs(mm/d) #daily
#- qobs_mm_per_hour #nldas



static_attributes:
# - carbonate_rocks_frac
 - geol_porostiy
 - geol_permeability
 - sand_frac
 - silt_frac
 - clay_frac
 - elev_mean
 - slope_mean
 - area_gages2
# ==========================================================
# Optimization
# ==========================================================

optimizer: Adam

loss: MSE


learning_rate:

  0: 0.001
  12: 0.0001
  15: 0.00007
  #24: 0.00003


# Important:
# Keep this for compatibility with NH,
# but the parallel sampler controls basin batch size.

batch_size: 10


epochs: 30


clip_gradient_norm: 1



# ==========================================================
# Evaluation
# ==========================================================

metrics:

  - NSE
  - KGE
  - Alpha-NSE
  - Beta-NSE



# ==========================================================
# Reproducibility
# ==========================================================

seed: 555



# ==========================================================
# Hardware
# ==========================================================

device: cpu

num_workers: 8



# ==========================================================
# Logging / Saving
# ==========================================================

validate_every: 3

validate_n_random_basins: 10

cache_validation_data: true

save_weights_every: 1

save_validation_results: false

log_tensorboard: false

log_interval: 10

log_n_figures: 0
